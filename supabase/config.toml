# Supabase CLI config for local development (`supabase start`, `supabase test db`).
# Production project: EU Frankfurt (eu-central-1), created in the dashboard (deploy concern).
project_id = "whatsapp-gateway"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# TOTP MFA is mandatory for the dashboard (AAL2 enforced in RLS, ARCH §7.5).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Cron-invoked functions authenticate with the x-cron-secret header (Vault edge_cron_secret),
# not with a user JWT.
[functions.heartbeat-alert]
verify_jwt = false

[functions.cloud-retry]
verify_jwt = false

[functions.deliver-webhooks]
verify_jwt = false
